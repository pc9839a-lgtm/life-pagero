<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-label="연말정산 미리보기 단계별 안내 도식"><rect width="1400" height="788" fill="#f6f8fa"/><rect x="64" y="58" width="1272" height="672" rx="24" fill="white" stroke="#e0e5e9" stroke-width="2"/><text x="108" y="145" fill="#243546" font-size="50" font-weight="750" font-family="Pretendard, Noto Sans KR, sans-serif">미리보기 화면의 숫자는 어디서 오나요?</text><text x="108" y="199" fill="#526477" font-size="28" font-family="Pretendard, Noto Sans KR, sans-serif">신용카드 사용금액은 실적과 예상액을 구분해 확인하세요.</text><rect x="108" y="252" width="550" height="272" rx="16" fill="#eaf2fa"/><text x="145" y="316" fill="#37618a" font-size="31" font-family="Pretendard, Noto Sans KR, sans-serif">2026년 1~9월</text><text x="145" y="390" fill="#1c3854" font-size="49" font-weight="750" font-family="Pretendard, Noto Sans KR, sans-serif">조회된 사용액</text><text x="145" y="454" fill="#526477" font-size="27" font-family="Pretendard, Noto Sans KR, sans-serif">카드사 제출 데이터 확인</text><text x="682" y="387" fill="#66798b" font-size="52" font-family="Pretendard, Noto Sans KR, sans-serif">＋</text><rect x="754" y="252" width="480" height="272" rx="16" fill="#eef1f5"/><text x="791" y="316" fill="#37618a" font-size="31" font-family="Pretendard, Noto Sans KR, sans-serif">2026년 10~12월</text><text x="791" y="390" fill="#1c3854" font-size="49" font-weight="750" font-family="Pretendard, Noto Sans KR, sans-serif">직접 예상 입력</text><text x="791" y="454" fill="#526477" font-size="27" font-family="Pretendard, Noto Sans KR, sans-serif">연말까지 바뀔 수 있는 값</text><text x="108" y="594" fill="#334c62" font-size="29" font-family="Pretendard, Noto Sans KR, sans-serif">가상 예시: 조회 900만 원 + 예상 300만 원 = 합계 1,200만 원</text><text x="108" y="638" fill="#687480" font-size="24" font-family="Pretendard, Noto Sans KR, sans-serif">예상 사용액의 변화는 실제 세액공제 또는 환급 금액과 동일하지 않습니다.</text><text x="108" y="686" fill="#687480" font-size="24" font-family="Pretendard, Noto Sans KR, sans-serif">2026.11.04 확인 · 대한민국 정책브리핑(국세청) 기준 · 생활비서 설명용 도식</text></svg>