name: LIVE CSS assets check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe public and origin HTML CSS JS
        run: node scripts/audit-live-life-css.mjs
