name: Verify live PageRo Life AdSense endpoints

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-adsense.yml
      - scripts/**
      - public/robots.txt
      - .env.example
      - content/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check production canonical and ads.txt via real HTTP
        shell: bash
        run: |
          python - <<'PY'
          import time, urllib.request
          root = 'https://life.pagero.kr'
          checks = {
            root + '/': ('text/html', '<link rel="canonical" href="https://life.pagero.kr/">'),
            root + '/robots.txt': ('text/plain', 'Sitemap: https://life.pagero.kr/sitemap.xml'),
            root + '/ads.txt': ('text/plain', 'google.com, pub-1906196934401001, DIRECT, f08c47fec0942fa0'),
            root + '/sitemap.xml': ('xml', '<loc>https://life.pagero.kr/'),
          }
          pending = dict(checks)
          for attempt in range(1, 11):
            print(f'Live attempt {attempt}/10; remaining {len(pending)}', flush=True)
            for url, (mime, needle) in list(pending.items()):
              try:
                request = urllib.request.Request(url, headers={
                  'User-Agent':'Mozilla/5.0 (compatible; PageRoLiveSmoke/1.0)',
                  'Cache-Control':'no-cache'
                })
                with urllib.request.urlopen(request, timeout=12) as response:
                  status = response.status
                  content_type = response.headers.get('Content-Type', '').lower()
                  data = response.read(1200000).decode('utf-8', 'replace')
                ok = status == 200 and mime in content_type and needle in data
                print(f'{status} {url} content_type={content_type} expected={needle in data} ok={ok}', flush=True)
                if ok: del pending[url]
              except Exception as error:
                print(f'RETRY {url}: {str(error)[:130]}', flush=True)
            if not pending: break
            if attempt < 10: time.sleep(20)
          if pending:
            raise SystemExit('FAIL live production endpoints: ' + ', '.join(pending))
          print('PASS: real production canonical, robots, sitemap and ads.txt validated', flush=True)
          PY
