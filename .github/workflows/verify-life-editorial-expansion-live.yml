name: Verify live LIFE 46-guide editorial expansion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-life-editorial-expansion-live.yml'
      - 'content/editorial-expansions-car.json'
      - 'content/editorial-expansions-support.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify every canonical guide visibly contains unique scenario expansions
        run: |
          python - <<'PY'
          import concurrent.futures,html,json,re,time,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          root='https://pagero.kr/life/'
          cases={}
          for name in ('car','support'):
              cases.update(json.loads(Path('content/editorial-expansions-'+name+'.json').read_text(encoding='utf-8')))
          def read(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (PageRoLifeEditorialDepthLiveQA)','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as res:
                  return res.status,res.headers,res.read(850000).decode('utf-8','replace')
          def check_article(entry):
              category,slug=entry
              url=root+category+'/'+slug+'/'
              try:
                  status,headers,body=read(url)
                  plain=html.unescape(re.sub('<[^>]+>',' ',body))
                  expected=cases[slug]
                  missing=[head for head,_ in expected if head not in plain]
                  if status!=200 or missing or '<meta name="robots" content="index,follow' not in body:
                      return slug,False,'HTTP '+str(status)+' missing '+str(missing)
                  return slug,True,len(plain)
              except Exception as exc:
                  return slug,False,type(exc).__name__+': '+str(exc)[:120]
          for attempt in range(1,13):
              try:
                  _,_,raw=read(root+'sitemap.xml')
                  tree=ET.fromstring(raw)
                  urls=[e.text or '' for e in tree.iter() if e.tag.rsplit('}',1)[-1]=='loc']
                  entries=[]
                  for url in urls:
                      p=url.removeprefix(root).strip('/').split('/')
                      if len(p)==2 and p[0] in ('car','support'):
                          entries.append(tuple(p))
                  if len(entries)!=46:
                      raise ValueError('Expected 46 article URLs, got '+str(len(entries)))
                  missing_data=[s for _,s in entries if s not in cases]
                  if missing_data:raise ValueError('Missing editorial data: '+str(missing_data))
                  with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                      results=list(pool.map(check_article,entries))
                  failed=[r for r in results if not r[1]]
                  print('LIVE_EDITORIAL_DEPTH',attempt,'PASS',len(results)-len(failed),'FAIL',len(failed),'SAMPLE_FAILURES',failed[:5],flush=True)
                  if not failed:
                      print('LIVE_46_ARTICLES_PASSED',len(results),'MIN_VISIBLE_CHARACTERS',min(r[2] for r in results),flush=True)
                      for section in (2,3):
                          url=root+'car/car-inspection-period/'+str(section)+'/'
                          status,_,content=read(url)
                          plain=html.unescape(re.sub('<[^>]+>',' ',content))
                          if status!=200 or cases['car-inspection-period'][section-1][0] not in plain or 'noindex,follow' not in content:
                              raise ValueError('Continuation page scenario not live '+url)
                      print('LIVE_CONTINUATION_CHECK_PASSED',flush=True)
                      break
              except Exception as e:
                  print('LIVE_RETRY',attempt,type(e).__name__,str(e)[:180],flush=True)
              if attempt==12:raise SystemExit('Public 46-guide editorial expansion not deployed or incomplete')
              time.sleep(15)
          PY
