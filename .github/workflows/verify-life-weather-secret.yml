name: Verify LIFE KMA weather after Cloudflare secret registration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-life-weather-secret.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read production status without printing keys
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.error,urllib.request
          urls=[
            ('production','https://life-pagero.pages.dev/today/api/weather?city=seoul'),
            ('public','https://pagero.kr/life/today/api/weather?city=seoul')
          ]
          for attempt in range(1,7):
            all_ok=True
            for name,url in urls:
              try:
                r=urllib.request.Request(url,headers={'User-Agent':'LifeWeatherSecureIntegrationCheck/1.0','Cache-Control':'no-cache'})
                try:
                  with urllib.request.urlopen(r,timeout=12) as q:
                    http=q.status; body=q.read(25000)
                except urllib.error.HTTPError as e:
                  http=e.code;body=e.read(25000)
                data=json.loads(body)
                status=data.get('status')
                valid=http==200 and status=='ok' and isinstance(data.get('temperatureC'),(int,float))
                print('WEATHER_LIVE_CHECK',name,'HTTP',http,'status',status,'city',data.get('city'),'temperature_present',isinstance(data.get('temperatureC'),(int,float)),flush=True)
                if not valid:all_ok=False
              except Exception as e:
                all_ok=False
                print('WEATHER_CHECK_ERROR',name,type(e).__name__,str(e)[:100],flush=True)
            if all_ok:
              print('WEATHER_API_CONNECTED_AND_PUBLIC',flush=True)
              break
            if attempt==6:
              print('WEATHER_API_NOT_ACTIVE - check Production secret and redeploy in Cloudflare',flush=True)
              raise SystemExit(1)
            time.sleep(10)
          PY
