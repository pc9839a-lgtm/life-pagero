name: Verify LIFE compact first screen in production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-life-compact-live.yml'
      - 'public/life-compact.css'
      - 'public/life-compact.js'
      - 'scripts/compact-life-ui.mjs'
      - 'scripts/build-production.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Confirm real public first screen, assets and full reading content
        shell: bash
        run: |
          python - <<'PY'
          import re,time,urllib.request
          base='https://pagero.kr/life'
          def get(path):
            req=urllib.request.Request(base+path,headers={
              'User-Agent':'Mozilla/5.0 (LifeCompactProductionQA)',
              'Cache-Control':'no-cache','Pragma':'no-cache'
            })
            with urllib.request.urlopen(req,timeout=22) as r:
              return r.status,r.read(1800000).decode('utf-8','replace')
          def check():
            checks={}
            status,home=get('/')
            checks['home-200']=status==200
            checks['one-line-question']='<h1>무엇을 찾고 계신가요?</h1>' in home
            checks['search']= 'id="portal-home-q"' in home
            checks['six-simple-topics']=len(re.findall(r'class="portal-topic-card compact-topic"',home))==6
            checks['six-one-click-links']=len(re.findall(r'class="compact-topic-link"',home))==6
            checks['no-topic-article-lists']='portal-topic-card-head' not in home
            popular=re.search(r'<section class="compact-popular"[\s\S]*?</section>',home)
            checks['three-popular']=bool(popular) and len(re.findall(r'<li><a href=',popular.group(0)))==3
            checks['extras-closed']=all(t in home for t in [
              '<details class="compact-explore"><summary>상황별로 찾아보기</summary>',
              '<details class="compact-explore compact-latest">',
              '<details class="modern-all-articles">'
            ])
            checks['canonical']='<link rel="canonical" href="'+base+'/">' in home
            checks['advertisement-counts']=len(re.findall(r'data-affiliate="tenping-',home))==4 and len(re.findall(r'data-life-coupang-kind="(?:body|middle)"',home))==2
            for p in ['car/','support/']:
              code,page=get('/'+p)
              checks[p+'-searchable']=code==200 and 'modern-list-filter' in page and 'compact-category-links' in page
            for slug in ['/car/car-inspection-period/','/support/basic-pension-2026/','/support/housing-benefit-2026/']:
              code,page=get(slug)
              content=re.search(r'<div class="article-content">([\s\S]*?)<div class="disclaimer">',page)
              checks[slug+'-full-article']=(
                code==200 and 'class="compact-answer"' in page and
                '<details id="compact-full-guide" class="compact-full-guide">' in page and
                content is not None and len(content.group(1))>6000 and
                not re.search(r'<h[234](?:\s[^>]*)?>',content.group(1))
              )
            code,css=get('/life-compact.css')
            checks['compact-css']=code==200 and '.compact-topic-link' in css and '@media(max-width:700px)' in css
            code,js=get('/life-compact.js')
            checks['read-more-js']=code==200 and 'guide.open = true' in js
            print('COMPACT_LIVE_CHECK',checks,flush=True)
            return [k for k,v in checks.items() if not v]
          for attempt in range(1,19):
            try:
              failed=check()
              if not failed:
                print('COMPACT_LIVE_PRODUCTION_VERIFIED',base,'attempt',attempt,flush=True)
                break
              print('COMPACT_LIVE_PENDING',attempt,failed,flush=True)
            except Exception as e:
              print('COMPACT_LIVE_RETRY',attempt,type(e).__name__,str(e)[:140],flush=True)
            if attempt==18:raise SystemExit('LIFE compact homepage not deployed or not intact')
            time.sleep(12)
          PY
