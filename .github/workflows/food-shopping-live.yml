name: Food shopping live API smoke
# Production API smoke is explicitly invoked to avoid paid calls on routine PRs.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shop_api:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check actual food products in production
        run: node scripts/audit-food-shop-live.mjs
