name: Verify LIFE official comparisons and source replacements
on:
  push:
    branches: [main, fix/adsense-life-primary-source-comparison-20261022]
    paths:
      - scripts/apply-content-updates.mjs
      - automation/editorial-patches/emergency-welfare-livelihood-2026-extra.json
      - automation/editorial-patches/flu-vaccination-children-2026-factfix.json
      - automation/editorial-patches/disabled-child-allowance-2026-comparison.json
      - scripts/verify-adsense-three-guides.mjs
      - .github/workflows/verify-life-official-comparisons.yml
  pull_request:
    paths:
      - scripts/apply-content-updates.mjs
      - automation/editorial-patches/**
      - scripts/verify-adsense-three-guides.mjs
      - .github/workflows/verify-life-official-comparisons.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compressed content, fact-checked patches and build final static pages
        run: npm run build
      - name: Check article source evidence and rendered public content
        run: node scripts/verify-adsense-three-guides.mjs
      - name: Compare quality issues with previously known baseline
        shell: bash
        run: |
          node scripts/editorial-quality-audit.mjs
          node - <<'JS'
          const fs=require('node:fs');
          const audit=JSON.parse(fs.readFileSync('editorial-quality-report.json','utf8'));
          if(audit.flagged>23)throw Error('New source comparisons did not reduce flagged guides from 26 to at most 23');
          const targets=['emergency-welfare-livelihood-2026','flu-vaccination-children-2026','disabled-child-allowance-2026'];
          for(const slug of targets){
            const row=audit.articles.find(r=>r.file.includes(slug+'.json'));
            if(!row || row.issue_count)throw Error(slug+' still flagged: '+JSON.stringify(row?.issues));
          }
          console.log('PASS LIFE quality signals',audit.flagged,'flagged of',audit.article_count);
          JS
