name: LIFE SEO build and live indexability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '35 21 * * *'
  workflow_dispatch:
    inputs:
      seasonal_refresh:
        description: 'Validate monthly Seoul food rebuild and exact Cloudflare deployment SHA'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.seasonal_refresh == true && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source and generated pages
        run: |
          npm run check
          npm run build
      - name: Install headless Chromium for real responsive regression
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Validate live page interactions against rebuilt LIFE through a simulated Pagero proxy
        if: github.event_name == 'pull_request'
        run: node scripts/life-integration-browser.mjs
      - name: Upload browser screenshots and failure details
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: life-mobile-desktop-browser-qa
          path: |
            artifacts/life-integrated-browser-qa.json
            artifacts/life-browser/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Save full homepage-to-sitemap link graph (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-canonical-link-graph
          path: artifacts/life-internal-link-graph.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save original-source review and duplication triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-editorial-quality-audit
          path: editorial-quality-report.json
          if-no-files-found: warn
          retention-days: 14

  live-indexability:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.seasonal_refresh != true)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public SEO (sitemap, canonical, noindex, redirects)
        run: npm run seo:audit:live
      - name: Save URL-level result, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-seo-runtime-audit
          path: artifacts/seo-runtime-audit.json
          if-no-files-found: warn

  live-diagnostic:
    # Production can be older than a PR; record evidence without gating builds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect current production (diagnostic, not a deployment assertion)
        continue-on-error: true
        run: npm run seo:audit:live
      - name: Upload public HTTP audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-seo-live-pr-diagnostic
          path: artifacts/seo-runtime-audit.json
          if-no-files-found: warn
          retention-days: 14

  postdeploy-browser:
    # Validate the exact merge commit against real Cloudflare after main pushes.
    # A PR's simulated proxy is not proof of a production deployment.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.seasonal_refresh == true && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ${{ github.sha }}
      LIFE_DEPLOY_WAIT_MS: '480000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chrome for the actual deployed production
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Wait for exact Cloudflare commit and test real desktop/mobile/browser SEO
        run: node scripts/life-postdeploy-browser.mjs
      - name: Run full live URL, redirects, robots and canonical verification
        run: npm run seo:audit:live
      - name: Save real-user-flow screenshots and final deployment SHA even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-production-postdeploy-browser
          path: |
            artifacts/life-production-browser-audit.json
            artifacts/life-production-browser/*.png
            artifacts/seo-runtime-audit.json
          if-no-files-found: warn
          retention-days: 21
