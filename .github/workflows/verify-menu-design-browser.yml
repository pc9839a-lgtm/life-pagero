name: Verify deployed LIFE menus in real desktop and mobile browsers
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-life-topics.mjs'
      - 'scripts/enhance-finance.mjs'
      - 'scripts/build-editorial-life.mjs'
      - 'assets/styles/editorial/20-category.css'
      - 'assets/styles/editorial/40-finance.css'
      - 'public/life-food.css'
      - 'public/events-ui.css'
      - 'public/adpick-deals.css'
      - 'public/real-estate.css'
      - 'scripts/verify-menu-design-browser.mjs'
      - '.github/workflows/verify-menu-design-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver (no image builds or external asset downloads)
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          which google-chrome || which google-chrome-stable || which chromium
      - name: Wait for the deployed editorial CSS version (not an old cached release)
        shell: bash
        run: |
          EXPECTED="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=['00-foundation.css','10-home.css','20-category.css','30-article.css',
            '40-finance.css','50-today.css','60-responsive.css','70-calculators.css','80-food-guides.css'];
          const combined=files.map(file=>fs.readFileSync('assets/styles/editorial/'+file,'utf8')).join('');
          process.stdout.write(createHash('sha256').update(combined).digest('hex').slice(0,12));
          NODE
          )"
          echo "Expected editorial CSS version: $EXPECTED"
          for attempt in $(seq 1 15); do
            HTML="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' \
              "https://pagero.kr/life/finance/?visual_qa=${GITHUB_SHA:0:10}" || true)"
            if [[ "$HTML" == *"life-editorial-20261106.css?v=$EXPECTED"* ]]; then
              echo "Live CSS is current (attempt $attempt)"
              exit 0
            fi
            sleep 10
          done
          echo 'Deployed site did not reach the current CSS version.'
          exit 1
      - name: Capture and verify deployed menus at 1280, 390 and 320 pixels
        env:
          LIFE_VISUAL_BASE_URL: https://pagero.kr/life
        run: node scripts/verify-menu-design-browser.mjs
      - name: Upload full-page screenshots for design inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-live-menu-screenshots
          path: artifacts/menu-design/
          if-no-files-found: warn
          retention-days: 7
