name: LIFE AdSense phase 2 — 18 published guide source quality
on:
  push:
    branches: [main, fix/life-adsense-source-precision-20261023]
    paths:
      - scripts/build-production.mjs
      - scripts/curate-published-primary-sources.mjs
      - .github/workflows/life-adsense-phase2-editorial.yml
  pull_request:
    paths:
      - scripts/build-production.mjs
      - scripts/curate-published-primary-sources.mjs
      - .github/workflows/life-adsense-phase2-editorial.yml
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build published articles, not stale historical source filenames
        run: npm run build
      - name: Audit published article set, remaining generic sources and substantive comparisons
        run: |
          node scripts/editorial-quality-audit.mjs
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const a=JSON.parse(fs.readFileSync('editorial-quality-report.json','utf8'));
          assert(a.article_count>=45,'Published article set unexpectedly shrank');
          assert(a.articles.some(x=>JSON.parse(fs.readFileSync('content/posts/'+x.file,'utf8')).slug==='year-end-tax-precheck-2026'),'New 2026 tax preview publication is not in the live article set');
          assert.equal(a.flagged,0,'Unresolved content triage: '+JSON.stringify(a.articles.filter(x=>x.issue_count).map(x=>[x.file,x.issues])));
          assert.equal(a.any_homepage_source,0,'Generic homepage citations remain in published source lists');
          assert.equal(a.common_paragraph_count,0,'Shared long paragraphs added');
          const ids=['car-inspection-period','culture-card-2026','energy-voucher-2026','earned-income-tax-credit-late-2026','used-car-transfer-cost'];
          for(const slug of ids){
            // Some historical JSON filenames are deliberately reused by content bundle hydration.
            // Resolve by the ACTUAL published slug, never assume filename == slug.
            const row=a.articles.find(x=>{
              const p=JSON.parse(fs.readFileSync('content/posts/'+x.file,'utf8'));
              return p.slug===slug;
            });
            assert(row,'Missing selected publicly published slug '+slug);
            const doc=JSON.parse(fs.readFileSync('content/posts/'+row.file,'utf8'));
            const html=fs.readFileSync('dist/'+doc.category+'/'+doc.slug+'/index.html','utf8');
            assert(doc.officialCta?.href,'Original official action missing '+slug);
            const novemberComparisons = {
              'car-inspection-period': '만료일 전 90일',
              'energy-voucher-2026': '월 지급금이 아니라',
              'earned-income-tax-credit-late-2026': '2025년 연간 소득',
              'culture-card-2026': '11월 30일',
            };
            const reviewedMarker = novemberComparisons[slug] || '취득세';
            assert(html.includes(reviewedMarker),'Verified factual comparison missing '+slug);
            if (Object.hasOwn(novemberComparisons,slug)) {
              assert.equal(doc.reviewedAt,'2026-11-03','November official fact-check not preserved: '+slug);
            }
            if (slug === 'car-inspection-period') {
              assert(html.includes('만료일 전 90일'),'Inspection date calculation missing');
            }
            if (slug === 'energy-voucher-2026') {
              assert(html.includes('12월 31일') && html.includes('월 지급금이 아니라'),'Energy voucher deadline or annual amount distinction missing');
            }
            if (slug === 'earned-income-tax-credit-late-2026') {
              assert(html.includes('12월 1일') && html.includes('2025년 연간 소득'),'Earned income tax credit late deadline or earning year missing');
            }
            if (slug === 'culture-card-2026') {
              assert(html.includes('11월 30일') && html.includes('12월 31일'),'Culture card issuance/use deadlines missing');
            }
            assert(html.includes('<table'),'First-page comparison table missing '+slug);
            assert(doc.sources.length>=2,'Two specific official records must remain '+slug);
          }
          console.log('PASS: all published guides including new tax preview, 0 heuristic source flags, 0 shared long paragraphs; 5 substantive official comparisons in primary HTML');
          JS
