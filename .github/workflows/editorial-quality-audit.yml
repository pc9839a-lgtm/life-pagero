name: LIFE original-content review
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/editorial-quality-audit.yml
      - scripts/editorial-quality-audit.mjs
      - content/posts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit all public LIFE articles for originality signals
        run: |
          node --check scripts/editorial-quality-audit.mjs
          node scripts/editorial-quality-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: life-editorial-quality-report
          path: editorial-quality-report.json
