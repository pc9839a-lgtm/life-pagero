name: LIFE visual smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and capture branch desktop and mobile
        shell: bash
        run: |
          set -e
          npm run build > /tmp/life-build.log 2>&1 || { cat /tmp/life-build.log; exit 1; }
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Browser: $BROWSER"
          mkdir -p screenshots
          python3 -m http.server 8765 --directory dist >/tmp/life-http.log 2>&1 &
          sleep 2
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1100 --screenshot="screenshots/branch-savings-desktop.png" "http://127.0.0.1:8765/finance/savings-calculator/"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1100 --screenshot="screenshots/branch-mortgage-desktop.png" "http://127.0.0.1:8765/finance/mortgage-calculator/"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1100 --screenshot="screenshots/branch-car-desktop.png" "http://127.0.0.1:8765/tools/car-cost/"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot="screenshots/branch-savings-mobile.png" "http://127.0.0.1:8765/finance/savings-calculator/"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot="screenshots/branch-mortgage-mobile.png" "http://127.0.0.1:8765/finance/mortgage-calculator/"
          find screenshots -type f -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: life-branch-visual
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 1
