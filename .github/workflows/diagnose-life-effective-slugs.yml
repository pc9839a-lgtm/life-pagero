name: Identify effective LIFE article identities after content bundles
on:
  push:
    branches: [fix/adsense-life-primary-source-comparison-20261022]
    paths: ['.github/workflows/diagnose-life-effective-slugs.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect bundle-hydrated identities without publishing or changing remote data
        shell: bash
        run: |
          rm automation/editorial-patches/government-support-search-20261022.json
          rm automation/editorial-patches/support-eligibility-check-20261022.json
          rm automation/editorial-patches/support-application-documents-20261022.json
          node scripts/apply-content-updates.mjs
          node - <<'JS'
          const fs=require('node:fs');const p=require('node:path');
          let records=[];
          function walk(dir){for(const x of fs.readdirSync(dir,{withFileTypes:true})){const file=p.join(dir,x.name);if(x.isDirectory())walk(file);else if(file.endsWith('.json')){const d=JSON.parse(fs.readFileSync(file,'utf8'));records.push({file,slug:d.slug,title:d.title,category:d.category});}}}
          walk('content/posts');
          console.log('EFFECTIVE_COUNT',records.length);
          for(const x of records)console.log('EFFECTIVE',JSON.stringify(x));
          JS
