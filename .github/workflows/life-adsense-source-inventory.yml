name: Diagnose remaining official source precision
on:
  push:
    branches: [fix/life-adsense-source-precision-20261023]
    paths: ['.github/workflows/life-adsense-source-inventory.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build actual published content and output the 18 flagged source sets
        shell: bash
        run: |
          npm run build > /tmp/life-build.txt
          node scripts/editorial-quality-audit.mjs > /tmp/life-audit.txt
          node - <<'JS'
          const fs=require('node:fs');
          const path=require('node:path');
          const report=JSON.parse(fs.readFileSync('editorial-quality-report.json','utf8'));
          const bad=report.articles.filter(x=>x.issue_count);
          console.log('FLAGGED_COUNT',bad.length);
          for(const x of bad){
            const doc=JSON.parse(fs.readFileSync(path.join('content/posts',x.file),'utf8'));
            console.log('SOURCE_DETAIL',JSON.stringify({file:x.file,slug:doc.slug,title:doc.title,category:doc.category,homepageSources:x.home_sources,sources:doc.sources.map(s=>({name:s.name,url:s.url})),heading:doc.series?.parts?.[0]?.title,bodyFirst:doc.body?.slice(0,300)}));
          }
          JS
