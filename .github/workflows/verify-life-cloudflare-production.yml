name: Verify LIFE Cloudflare production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Compare public deployed commit with this main push
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          commit=os.environ['EXPECTED_SHA']
          site='https://pagero.kr/life'
          probes={
            'deployment manifest':(site+'/deployment.json',lambda body: json.loads(body).get('commit')==commit),
            'indexable child-allowance guide':(
              site+'/support/child-allowance-2026/',
              lambda body: '2017년생, 이미 9세 생일 경과' in body
              and 'www.ep.go.kr/dong/selectBbsNttView.do' in body
              and 'rel="canonical" href="https://pagero.kr/life/support/child-allowance-2026/"' in body),
            'indexable housing guide':(
              site+'/support/housing-benefit-2026/',
              lambda body: '335,000원' in body and '414,000원' in body),
          }
          pending=dict(probes)
          print('Expected Cloudflare Pages git commit:',commit,flush=True)
          for attempt in range(1,16):
            for label,(url,check) in list(pending.items()):
              try:
                req=urllib.request.Request(
                  url+'?deploy_verify='+commit[:12],
                  headers={'User-Agent':'Mozilla/5.0 (compatible; LIFE-PagesDeployVerification/1.0)',
                           'Cache-Control':'no-cache', 'Pragma':'no-cache'})
                with urllib.request.urlopen(req,timeout=12) as response:
                  status=response.status
                  ct=response.headers.get('Content-Type','')
                  body=response.read(2500000).decode('utf-8','replace')
                ok=status==200 and check(body)
                print(f'Attempt {attempt}/15: {label}: HTTP {status}, type={ct}, expected_version={ok}',flush=True)
                if ok: del pending[label]
              except Exception as error:
                print(f'Attempt {attempt}/15: {label}: RETRY {str(error)[:200]}',flush=True)
            if not pending:
              print('PASS: Cloudflare live content and deployment commit match this main push',flush=True)
              break
            if attempt<15: time.sleep(18)
          if pending:
            raise SystemExit('LIVE DEPLOYMENT NOT VERIFIED for commit '+commit+': '+', '.join(pending))
          PY
