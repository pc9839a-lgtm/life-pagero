name: Preserve existing licensed LIFE food images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preserve-food-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect verified identical licensed photos
        run: node scripts/collect-licensed-food-images.mjs
      - name: Export original JPEGs and attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-licensed-food-photos
          path: artifacts/food-images/
          if-no-files-found: error
          retention-days: 7
