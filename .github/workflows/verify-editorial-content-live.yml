name: Verify published editorial value on two sites
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-editorial-content-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check real editorial body and table, not only HTTP 200
        shell: bash
        run: |
          python - <<'PY'
