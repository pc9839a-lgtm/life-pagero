name: Verify published editorial value on two sites
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-editorial-content-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check real editorial body and table, not only HTTP 200
        shell: bash
        run: |
          python - <<'PY'
          import time, urllib.request
          checks={
            'https://pagero.kr/life/support/ev-subsidy-search/':[
              '출고잔여',
              '2026년 공식 지원 대상',
              'article-data-table',
              'https://ev.or.kr/nportal/buySupprt/initSubsidyPaymentCheckAction.do',
            ],
            'https://cruiseplay-dyt.pages.dev/blog/cruise-balcony-cabin-guide/':[
              '실제 이용 1회당 비용',
              'Harmony of the Seas',
              'royalcaribbean.com/refreshed/cruise-ships/harmony-of-the-seas/balcony',
            ],
          }
          pending=dict(checks)
          for attempt in range(1,8):
            print('Editorial HTTP verification round',attempt,flush=True)
            for url,needles in list(pending.items()):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; EditorialValueVerify/1.0)','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=15) as r:
                  content_type=r.headers.get('Content-Type','')
                  status=r.status
                  data=r.read(2000000).decode('utf-8','replace')
                missing=[s for s in needles if s not in data]
                print(url,'http',status,'type',content_type,'missing',missing,flush=True)
                if status==200 and 'text/html' in content_type and not missing:
                  del pending[url]
              except Exception as exc:
                print('WAIT',url,str(exc)[:160],flush=True)
            if not pending:break
            if attempt<7:time.sleep(12)
          if pending:
            raise SystemExit('FAIL: published content evidence missing on: '+', '.join(pending))
          print('PASS: live content has the real sourced article sections and rendered decision table',flush=True)
          PY
